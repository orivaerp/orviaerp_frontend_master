<div class="p-6 max-w-2xl mx-auto space-y-6">
  <div>
    <a routerLink="/dashboard/categories" class="text-sm text-[var(--color-text-muted)] hover:text-[var(--color-text)]">
      ← Back to categories
    </a>
    <h1 class="text-2xl font-semibold mt-2">New category</h1>
  </div>

  @if (errorMessage()) {
    <div class="rounded-[var(--radius-md)] bg-[var(--color-danger-soft)] px-3.5 py-2.5 text-sm text-[var(--color-danger)]">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="card p-5 space-y-4">
    <div>
      <label class="label" for="name">Name</label>
      <input id="name" class="input" formControlName="name" placeholder="Website" />
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <p class="field-error">Name needs at least 2 characters.</p>
      }
    </div>

    <div>
      <label class="label" for="parent">Parent category</label>
      <select id="parent" class="input" formControlName="parent">
        <option value="">— None (top-level category) —</option>
        @for (parent of parents(); track parent._id) {
          <option [value]="parent._id">{{ parent.name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="label" for="description">Description</label>
      <textarea id="description" class="input" rows="3" formControlName="description" placeholder="Shown on the category page"></textarea>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="label" for="icon">Icon</label>
        <input id="icon" class="input" formControlName="icon" placeholder="e.g. globe" />
      </div>
      <div>
        <label class="label" for="image">Image URL</label>
        <input id="image" class="input" formControlName="image" placeholder="https://…" />
      </div>
    </div>

    <div class="flex items-center gap-6">
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" formControlName="isActive" class="h-4 w-4" />
        Active
      </label>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" formControlName="isFeatured" class="h-4 w-4" />
        Featured
      </label>
    </div>

    <div class="flex items-center gap-3 pt-2">
      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Saving…' : 'Create category' }}
      </button>
      <a routerLink="/dashboard/categories" class="btn-ghost">Cancel</a>
    </div>
  </form>
</div>
