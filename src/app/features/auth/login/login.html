<app-auth-shell title="Welcome back" subtitle="Log in to your OERP account">
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    @if (errorMessage()) {
      <div class="rounded-[var(--radius-md)] bg-[var(--color-danger-soft)] px-3.5 py-2.5 text-sm text-[var(--color-danger)]">
        {{ errorMessage() }}
      </div>
    }

    <div>
      <label class="label" for="email">Email</label>
      <input
        id="email"
        type="email"
        class="input"
        [class.input-error]="form.controls.email.invalid && form.controls.email.touched"
        formControlName="email"
        placeholder="you@company.com"
        autocomplete="email"
      />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="field-error">Enter a valid email address.</p>
      }
    </div>

    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label class="label !mb-0" for="password">Password</label>
        <a routerLink="/forgot-password" class="text-xs font-medium text-[var(--color-primary-600)] hover:underline">
          Forgot password?
        </a>
      </div>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          class="input pr-10"
          [class.input-error]="form.controls.password.invalid && form.controls.password.touched"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 flex items-center px-3 text-xs font-medium text-[var(--color-text-muted)]"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="field-error">Password is required.</p>
      }
    </div>

    <button type="submit" class="btn-primary btn-block" [disabled]="loading()">
      @if (loading()) {
        <span>Logging in…</span>
      } @else {
        <span>Log in</span>
      }
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-[var(--color-text-muted)]">
    New to OERP?
    <a routerLink="/register" class="font-medium text-[var(--color-primary-600)] hover:underline">Create an account</a>
  </p>
</app-auth-shell>
