@if (dialog.state(); as state) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
    (click)="respond(false)"
  >
    <div
      class="card w-full max-w-sm p-5 shadow-[var(--shadow-popover)]"
      (click)="$event.stopPropagation()"
    >
      <h2 class="text-lg font-semibold">{{ state.title }}</h2>
      <p class="mt-2 text-sm text-[var(--color-text-muted)]">{{ state.message }}</p>

      <div class="mt-6 flex items-center justify-end gap-3">
        <button type="button" class="btn-outline" (click)="respond(false)">
          {{ state.cancelText }}
        </button>
        <button
          type="button"
          class="btn"
          [class]="
            state.danger
              ? 'btn bg-[var(--color-danger)] text-white hover:bg-red-700'
              : 'btn-primary'
          "
          (click)="respond(true)"
        >
          {{ state.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
